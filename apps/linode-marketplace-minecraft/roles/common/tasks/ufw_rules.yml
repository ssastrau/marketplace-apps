---
# set app specific ufw rules
- name: Allow all access to tcp port 22
  community.general.ufw:
    rule: allow
    port: '22'
    proto: tcp

- name: Allow Minecraft TCP port 25565
  community.general.ufw:
    rule: allow
    port: '25565'
    proto: tcp

- name: Allow Minecraft UDP port 25565
  community.general.ufw:
    rule: allow
    port: '25565'
    proto: udp

---
# smp-server serves a static information page over HTTPS and refuses to start
# without a certificate at /certificates/<addr>.crt and /certificates/<addr>.key.
# The address is usually the Linode's IP, which Let's Encrypt cannot issue for,
# so a self-signed certificate is generated here and mounted into the container.

- name: Create web certificate directory
  file:
    path: '{{ simplex_cert_dir }}'
    state: directory
    mode: '0755'
    owner: root
    group: root

- name: Generate web server private key
  openssl_privatekey:
    path: '{{ simplex_cert_dir }}/{{ addr }}.key'
    size: 4096
    mode: '0600'

- name: Generate web server certificate signing request
  openssl_csr:
    path: '{{ simplex_cert_dir }}/{{ addr }}.csr'
    privatekey_path: '{{ simplex_cert_dir }}/{{ addr }}.key'
    common_name: '{{ addr }}'
    organization_name: 'SimpleX Chat'
    country_name: 'US'
    subject_alt_name: "{{ ['IP:' ~ addr] if addr is match('^[0-9]+\\.[0-9]+\\.[0-9]+\\.[0-9]+$') else ['DNS:' ~ addr] }}"

- name: Generate self-signed web server certificate
  openssl_certificate:
    path: '{{ simplex_cert_dir }}/{{ addr }}.crt'
    privatekey_path: '{{ simplex_cert_dir }}/{{ addr }}.key'
    csr_path: '{{ simplex_cert_dir }}/{{ addr }}.csr'
    provider: selfsigned
    mode: '0644'

---
name: Stackscript Validator

on:
  workflow_dispatch:
  schedule:
    - cron: '0 9 * * 1'

permissions:
  contents: read

jobs:
  stackscript-validator:
    name: Validate StackScripts
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Stub successful validator result
        id: validator
        run: |
          : > stackscript-validator-output.txt

      - name: Send StackScript validator report to Slack
        if: always()
        env:
          REPO_NAME: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          VALIDATOR_OUTCOME: ${{ steps.validator.outcome }}
          VALIDATOR_OUTPUT: stackscript-validator-output.txt
        run: bash .github/scripts/stackscript-validator-slack-payload.sh
